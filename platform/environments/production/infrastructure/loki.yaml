apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-production
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.6.4
      helm:
        valueFiles:
          - $values/infrastructure/loki/values-production.yaml
    - repoURL: https://github.com/steviepreston/minilab.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
       - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
      - /spec/template/metadata/annotations
      - /metadata/annotations
    - group: apps
      kind: StatefulSet
      jsonPointers:
      - /spec/volumeClaimTemplates
      - /spec/template/metadata/annotations
    - group: ""
      kind: ConfigMap
      jsonPointers:
      - /data
