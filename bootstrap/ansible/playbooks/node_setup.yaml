---
- name: Setting up k3s nodes
  hosts: k3s_cluster
  become: yes
  tasks:
    - name: Starting node preparation
      debug:
        msg: "Preparing {{ inventory_hostname }} for k3s installation"

    - name: Configure static IP with netplan
      template:
        src: templates/node/netplan-static-ip.j2
        dest: /etc/netplan/01-netcfg.yaml
        backup: yes
        mode: '0600'
      notify: Apply netplan

    - name: Disable cloud-init network config
      copy:
        content: "network: {config: disabled}"
        dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg

    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all apt packages
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes

    - name: Install development tools
      apt:
        name:
          - git
          - curl
          - wget
          - gnupg
          - software-properties-common
          - apt-transport-https
          - lsb-release
          - iptables
          - conntrack
          - socat
          - ca-certificates
        state: present

    - name: Install docker
      apt:
        name: docker.io
        state: present

    - name: Add admin to docker group
      user:
        name: admin
        groups: docker
        append: yes

    - name: Get latest kubectl version
      uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: yes
      register: kubectl_version

    - name: Install kubectl 
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/arm64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Get latest helm version from GitHub API
      uri:
        url: https://api.github.com/repos/helm/helm/releases/latest
        return_content: yes
      register: helm_release

    - name: Extract helm version tag
      set_fact:
        helm_version: "{{ (helm_release.content | from_json).tag_name }}"

    - name: Install latest helm
      unarchive:
        src: "https://get.helm.sh/helm-{{ helm_version }}-linux-arm64.tar.gz"
        dest: /tmp
        remote_src: yes

    - name: Move helm binary
      copy:
        src: /tmp/linux-arm64/helm
        dest: /usr/local/bin/helm
        mode: '0755'
        remote_src: yes

    - name: Find actual cmdline.txt location
      shell: find /boot/firmware -name "cmdline.txt" 2>/dev/null | head -1
      register: cmdline_location
      changed_when: false
      failed_when: false

    - name: Set cmdline path if found
      set_fact:
        cmdline_path: "{{ cmdline_location.stdout }}"
      when: cmdline_location.stdout != ""

    - name: Show cmdline.txt location
      debug:
        msg: "Found cmdline.txt at: {{ cmdline_path }}"
      when: cmdline_location.stdout != ""

    - name: Warn if cmdline.txt not found
      debug:
        msg: "WARNING: cmdline.txt not found in /boot/firmware - cgroup configuration will be skipped!"
      when: cmdline_location.stdout == ""

    - name: Backup cmdline.txt before modification
      copy:
        src: "{{ cmdline_path }}"
        dest: "{{ cmdline_path }}.backup-{{ ansible_date_time.epoch }}"
        remote_src: yes
      when: cmdline_location.stdout != ""

    - name: Read current cmdline content
      slurp:
        src: "{{ cmdline_path }}"
      register: cmdline_content
      when: cmdline_location.stdout != ""

    - name: Check current cgroup settings
      set_fact:
        has_cgroup_disable: "{{ 'cgroup_disable=memory' in (cmdline_content.content | b64decode) }}"
        has_cgroup_enable: "{{ 'cgroup_enable=memory' in (cmdline_content.content | b64decode) }}"
      when: cmdline_location.stdout != ""

    - name: Show current cgroup status
      debug:
        msg:
          - "Has cgroup_disable=memory: {{ has_cgroup_disable | default('N/A') }}"
          - "Has cgroup_enable=memory: {{ has_cgroup_enable | default('N/A') }}"
      when: cmdline_location.stdout != ""

    - name: Fix cmdline.txt for k3s - remove cgroup_disable and add cgroup_enable
      shell: |
        # Read current content, remove bad params, clean spaces
        cat {{ cmdline_path }} | \
          sed 's/cgroup_disable=memory//g' | \
          sed 's/\s\+/ /g' | \
          sed 's/^\s*//' | \
          tr -d '\n' > /tmp/cmdline.tmp
        
        # Add correct cgroup parameters if not already present
        if ! grep -q "cgroup_enable=memory" /tmp/cmdline.tmp; then
          echo -n " cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory" >> /tmp/cmdline.tmp
        fi
        
        # Write back (single line, no trailing newline)
        cat /tmp/cmdline.tmp > {{ cmdline_path }}
        rm /tmp/cmdline.tmp
      register: cmdline_fixed
      when: 
        - cmdline_location.stdout != ""
        - (has_cgroup_disable | default(false)) or not (has_cgroup_enable | default(false))

    - name: Verify cmdline.txt was updated
      command: cat {{ cmdline_path }}
      register: updated_cmdline
      changed_when: false
      when: cmdline_fixed.changed | default(false)

    - name: Show updated cmdline
      debug:
        msg: "Updated: {{ updated_cmdline.stdout }}"
      when: cmdline_fixed.changed | default(false)

    - name: Verify cgroup_disable was removed
      shell: grep -c "cgroup_disable" {{ cmdline_path }} || echo "0"
      register: disable_count
      changed_when: false
      when: cmdline_location.stdout != ""

    - name: Verify cgroup_enable was added
      shell: grep -c "cgroup_enable=memory" {{ cmdline_path }} || echo "0"
      register: enable_count
      changed_when: false
      when: cmdline_location.stdout != ""

    - name: Show verification
      debug:
        msg:
          - "cgroup_disable count: {{ disable_count.stdout | default('N/A') }} (should be 0)"
          - "cgroup_enable count: {{ enable_count.stdout | default('N/A') }} (should be > 0)"
      when: cmdline_location.stdout != ""

    - name: Enable container features for RPi
      lineinfile:
        path: /boot/firmware/config.txt
        line: 'arm_64bit=1'
        create: yes
      register: config_changed

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
      loop:
        - br_netfilter
        - overlay

    - name: Ensure kernel modules load on boot
      lineinfile:
        path: /etc/modules-load.d/k3s.conf
        line: "{{ item }}"
        create: yes
      loop:
        - br_netfilter
        - overlay

    - name: Set sysctl parameters for k3s
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/k3s.conf
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Check if system reboot required
      stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Determine if reboot is needed
      set_fact:
        needs_reboot: "{{ reboot_required.stat.exists or (cmdline_fixed.changed | default(false)) or (config_changed.changed | default(false)) }}"

    - name: Show reboot status
      debug:
        msg: "{{ 'Reboot REQUIRED on ' + inventory_hostname if (needs_reboot | bool) else '✅ No reboot needed on ' + inventory_hostname }}"

    - name: Reboot system if required
      reboot:
        msg: "Rebooting to apply cgroup and kernel configuration changes"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: needs_reboot | bool

    - name: Wait for system to come back online
      wait_for_connection:
        delay: 30
        timeout: 300
      when: needs_reboot | bool

    - name: Verify boot parameters after reboot
      command: cat /proc/cmdline
      register: boot_params
      changed_when: false
      when: needs_reboot | bool

    - name: Show boot parameters
      debug:
        msg: "Boot params: {{ boot_params.stdout }}"
      when: needs_reboot | bool

    - name: Check for cgroup_disable in boot params (should be absent)
      shell: cat /proc/cmdline | grep "cgroup_disable=memory" || echo "NOT_FOUND"
      register: disable_check
      changed_when: false
      when: needs_reboot | bool

    - name: Check for cgroup_enable in boot params (should be present)
      shell: cat /proc/cmdline | grep "cgroup_enable=memory" || echo "NOT_FOUND"
      register: enable_check
      changed_when: false
      when: needs_reboot | bool

    - name: Show cgroup verification
      debug:
        msg:
          - "cgroup_disable in boot: {{ disable_check.stdout | default('N/A') }}"
          - "cgroup_enable in boot: {{ enable_check.stdout | default('N/A') }}"
      when: needs_reboot | bool

    - name: Check if using cgroup v2
      stat:
        path: /sys/fs/cgroup/cgroup.controllers
      register: cgroup_v2_check

    - name: Get cgroup v2 controllers
      command: cat /sys/fs/cgroup/cgroup.controllers
      register: cgroup_controllers
      changed_when: false
      when: cgroup_v2_check.stat.exists

    - name: Check legacy cgroup v1 (fallback)
      shell: cat /proc/cgroups | grep memory
      register: cgroup_v1_memory
      changed_when: false
      failed_when: false
      when: not cgroup_v2_check.stat.exists

    - name: Determine memory cgroup status
      set_fact:
        memory_cgroup_enabled: "{{ (cgroup_v2_check.stat.exists and 'memory' in cgroup_controllers.stdout) or (not cgroup_v2_check.stat.exists and 'memory' in (cgroup_v1_memory.stdout | default(''))) }}"
        cgroup_version: "{{ 'v2' if cgroup_v2_check.stat.exists else 'v1' }}"

    - name: Show cgroup configuration
      debug:
        msg:
          - "Cgroup version: {{ cgroup_version }}"
          - "{{ 'Controllers: ' + cgroup_controllers.stdout if cgroup_v2_check.stat.exists else 'Using cgroup v1' }}"
          - "Memory cgroup: {{ 'ENABLED' if memory_cgroup_enabled else 'DISABLED' }}"

    - name: Fail if memory cgroup not available
      fail:
        msg: "Memory cgroup is not available. k3s will not start properly."
      when: not memory_cgroup_enabled

    - name: Node preparation complete
      debug:
        msg: "{{ inventory_hostname }} is ready for k3s installation (cgroup {{ cgroup_version }})"

  handlers:
    - name: Apply netplan
      command: netplan apply

