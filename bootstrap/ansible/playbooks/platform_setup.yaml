---
- name: Bootstrap K3s Platform (MetalLB + ArgoCD)
  hosts: master_nodes
  become: yes
  vars:
    metallb_version: v0.13.12
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    manifests_path: "{{ playbook_dir }}/../../manifests"
    local_timeout: 300
    bootstrap_timeout: 300
    metallb_ip_range: "{{ lookup('env', 'MLB_IP') }}"

  pre_tasks:
    - name: Verify K3s is running
      shell: systemctl is-active k3s
      register: k3s_status
      failed_when: k3s_status.stdout != "active"

    - name: Verify kubectl connectivity
      shell: kubectl get nodes --no-headers
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: kubectl_test
      failed_when: kubectl_test.rc != 0

  tasks:
    # -------------------- MetalLB --------------------
    - name: Install MetalLB
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      retries: 3
      delay: 10

    - name: Wait for MetalLB pods to be ready
      shell: |
        kubectl wait -n metallb-system \
          --for=condition=ready pod \
          --selector=app=metallb \
          --timeout={{ local_timeout }}s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Apply MetalLB IP pool config
      copy:
        dest: /tmp/metallb-config.yaml
        content: |
          apiVersion: metallb.io/v1beta1
          kind: IPAddressPool
          metadata:
            name: default-pool
            namespace: metallb-system
          spec:
            addresses:
              - {{ metallb_ip_range }}
          ---
          apiVersion: metallb.io/v1beta1
          kind: L2Advertisement
          metadata:
            name: default-advertisement
            namespace: metallb-system
      register: metallb_config

    - name: Apply MetalLB configuration
      shell: kubectl apply -f /tmp/metallb-config.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # -------------------- ArgoCD --------------------
    - name: Create ArgoCD namespace
      shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false

    - name: Install ArgoCD
      shell: |
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      retries: 3
      delay: 10

    - name: Wait for ArgoCD server to be ready
      shell: |
        kubectl wait --namespace argocd \
          --for=condition=available deployment/argocd-server \
          --timeout={{ local_timeout }}s
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # -------------------- ArgoCD LoadBalancer --------------------
    - name: Create ArgoCD LoadBalancer Service (MetalLB)
      copy:
        dest: /tmp/argocd-lb.yaml
        content: |
          apiVersion: v1
          kind: Service
          metadata:
            name: argocd-server-lb
            namespace: argocd
          spec:
            type: LoadBalancer
            selector:
              app.kubernetes.io/name: argocd-server
            ports:
              - name: https
                port: 443
                targetPort: 8080
      register: argocd_lb

    - name: Apply ArgoCD LoadBalancer service
      shell: kubectl apply -f /tmp/argocd-lb.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # -------------------- Verify --------------------
    - name: Get ArgoCD admin password
      shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret \
          -o jsonpath="{.data.password}" 2>/dev/null | base64 -d || echo "Secret not found"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: argocd_password
      no_log: true

    - name: Display bootstrap summary
      debug:
        msg: |
          ================================================================================
          K3s Bootstrap Complete!
          ================================================================================
          MetalLB IP Range: {{ metallb_ip_range }}
          ArgoCD LoadBalancer: argocd-server-lb
          ArgoCD Login: admin / {{ argocd_password.stdout }}
          ================================================================================


- name: Bootstrap ArgoCD App of Apps
  hosts: master_nodes
  become: yes
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    local_apps_path: "{{ playbook_dir }}/../../../platform/apps_of_apps"
    remote_apps_path: "/tmp/argocd-apps"

  pre_tasks:
    - name: Wait for ArgoCD to be running
      shell: |
        kubectl get pods -n argocd --selector=app.kubernetes.io/name=argocd-server \
        --field-selector=status.phase=Running --no-headers
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: argocd_status
      failed_when: argocd_status.stdout_lines | length == 0

    - name: Create remote directory for App of Apps
      file:
        path: "{{ remote_apps_path }}"
        state: directory
        mode: '0755'

  tasks:
    - name: Copy App of Apps files
      copy:
        src: "{{ local_apps_path }}/"
        dest: "{{ remote_apps_path }}/"
        mode: '0644'

    - name: Apply App of Apps manifest
      shell: kubectl apply -f {{ remote_apps_path }}/aoa-production.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    - name: Display ArgoCD apps
      shell: kubectl get applications -n argocd
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: argocd_apps

    - name: Display completion summary
      debug:
        msg: |
          ================================================================================
          GitOps App of Apps Bootstrapped
          ================================================================================
          {{ argocd_apps.stdout }}
          ================================================================================

- name: Bootstrap Observability Platform via ArgoCD
  hosts: master_nodes
  become: yes
  vars:
    kubeconfig_path: /etc/rancher/k3s/k3s.yaml
    local_apps_path: "{{ playbook_dir }}/../../../platform/apps_of_apps"
    remote_apps_path: "/tmp/argocd-apps"
    
  pre_tasks:
    - name: Verify ArgoCD is running
      shell: |
        kubectl get pods -n argocd --selector=app.kubernetes.io/name=argocd-server --field-selector=status.phase=Running --no-headers
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: argocd_status
      failed_when: argocd_status.stdout_lines | length == 0

    - name: Create temporary directory for ArgoCD apps
      file:
        path: "{{ remote_apps_path }}"
        state: directory
        mode: '0755'

  tasks:
    # ==================== Copy ArgoCD Application Files ====================
    - name: Copy App of Apps files to remote
      copy:
        src: "{{ local_apps_path }}/"
        dest: "{{ remote_apps_path }}/"
        mode: '0644'

    # ==================== Create Prerequisites ====================
    - name: Create monitoring namespace
      shell: |
        kubectl create namespace {{ observability_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"

    # ==================== Deploy ArgoCD Applications ====================
    - name: Deploy App of Apps Pattern
      shell: |
        kubectl apply -f {{ remote_apps_path }}/aoa-production.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"


    # ==================== Verification ====================
    - name: Check ArgoCD applications status
      shell: |
        kubectl get applications -n argocd
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: argocd_apps

    - name: Display deployment status
      debug:
        msg: |
          ================================================================================
           GitOps Bootstrap Complete!
          ================================================================================
          
          ArgoCD Applications:
          {{ argocd_apps.stdout }}
          
          ================================================================================

  post_tasks:
    - name: Cleanup temporary apps directory
      file:
        path: "{{ remote_apps_path }}"
        state: absent

