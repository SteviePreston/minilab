            k3s_w01:
              ansible_host: "{{ lookup('env', 'W01_IP') }}"
            k3s_w02:
              ansible_host: "{{ lookup('env', 'W02_IP') }}"
            k3s_w03:
              ansible_host: "{{ lookup('env', 'W03_IP') }}"
