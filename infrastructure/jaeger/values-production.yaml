storage:
  type: elasticsearch

elasticsearch:
  enabled: true
  replicas: 1 
  persistence:
    enabled: true
    size: 25Gi
    storageClass: longhorn-storageclass
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"

allInOne:
  enabled: true
  image:
    tag: "1.55.0"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  args:
    - --es.server-urls=http://jaeger-production-elasticsearch:9200
    - --es.num-shards=1
    - --es.num-replicas=0
    - --collector.otlp.enabled=true
    - --collector.otlp.grpc.host-port=0.0.0.0:4317
    - --collector.otlp.http.host-port=0.0.0.0:4318

esIndexCleaner:
  enabled: true
  schedule: "55 23 * * *"
  numberOfDays: 14

collector:
  enabled: false
query:
  enabled: false
agent:
  enabled: false
cassandra:
  enabled: false

serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack

