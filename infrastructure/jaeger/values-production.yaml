storage:
  type: badger

persistence:
  enabled: true
  existingClaim: storage-jaeger-production
  mountPath: /badger

allInOne:
  enabled: true
  image:
    tag: "1.55.0"
  args:
    - --badger.ephemeral=false
    - --badger.directory-key=/badger/keys
    - --badger.directory-value=/badger/values
    - --collector.otlp.enabled=true

