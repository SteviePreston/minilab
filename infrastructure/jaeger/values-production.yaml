storage:
  type: badger

allInOne:
  enabled: true
  image:
    tag: "1.50.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  persistence:
    enabled: true
    storageClass: longhorn-storageclass
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    mountPath: /badger
  
  args:
    - --badger.ephemeral=false
    - --badger.consistency=false  
    - --badger.maintenance-interval=5m
    - --collector.otlp.enabled=true

  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
ingester:
  enabled: false
cassandra:
  enabled: false
elasticsearch:
  enabled: false

service:
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack

