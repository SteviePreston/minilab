storage:
  type: badger

allInOne:
  enabled: true
  image:
    tag: "1.55.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  args:
    - --badger.ephemeral=false
    - --badger.directory-key=/badger-data/key
    - --badger.directory-value=/badger-data/data
    - --badger.consistency=false  
    - --badger.maintenance-interval=5m
    - --collector.otlp.enabled=true
  
initContainers:
  - name: volume-permissions
    image: busybox:1.35
    command:
      - sh
      - -c
      - |
        echo "Setting up badger-data directory permissions..."
        mkdir -p /badger-data/key /badger-data/data
        chown -R 10001:10001 /badger-data || chown -R 1000:1000 /badger-data
        chmod -R 755 /badger-data
        ls -la /badger-data
        echo "Permissions setup complete"
    volumeMounts:
      - name: storage
        mountPath: /badger
    securityContext:
      runAsUser: 0

persistence:
  enabled: true
  existingClaim: "jaeger-badger"
  mountPath: /badger

agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
ingester:
  enabled: false
cassandra:
  enabled: false
elasticsearch:
  enabled: false
service:
  type: ClusterIP
  
serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack

