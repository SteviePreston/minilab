storage:
  type: memory  # Start with in-memory storage first

allInOne:
  enabled: true
  image:
    tag: "1.55.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
ingester:
  enabled: false
cassandra:
  enabled: false
elasticsearch:
  enabled: false

service:
  type: ClusterIP
  
serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack

    
