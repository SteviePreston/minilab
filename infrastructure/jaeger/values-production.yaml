storage:
  type: badger

allInOne:
  enabled: true
  image:
    tag: "1.55.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  persistence:
    enabled: true
    storageClass: longhorn-storageclass
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    mountPath: /badger
  
  args:
    - --badger.ephemeral=false
    - --badger.directory-key=/badger/key
    - --badger.directory-value=/badger/data
    - --badger.consistency=false  
    - --badger.maintenance-interval=5m
    - --collector.otlp.enabled=true

  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

  extraInitContainers:
    - name: fix-permissions
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Fixing ownership for /badger"
          mkdir -p /badger/key /badger/data
          chown -R 10001:10001 /badger
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      volumeMounts:
        - name: storage
          mountPath: /badger
    
agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
ingester:
  enabled: false
cassandra:
  enabled: false
elasticsearch:
  enabled: false

service:
  type: ClusterIP

serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack

