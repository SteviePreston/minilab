  
allInOne:
  enabled: true
  image:
    tag: "1.55.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  args:
    - --badger.ephemeral=false
    - --badger.directory-key=/badger-data/key
    - --badger.directory-value=/badger-data/data
    - --badger.consistency=false  
    - --badger.maintenance-interval=5m
    - --collector.otlp.enabled=true
  
  volumeMounts:
    - name: data
      mountPath: /badger
      
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: jaeger-badger

extraObjects:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: jaeger-badger
      namespace: observability
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn-storageclass
      resources:
        requests:
          storage: 10Gi

agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
ingester:
  enabled: false
cassandra:
  enabled: false
elasticsearch:
  enabled: false

service:
  type: ClusterIP
  
serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack
