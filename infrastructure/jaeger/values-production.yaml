storage:
  type: badger

allInOne:
  enabled: true
  image:
    tag: "1.50.0"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  persistence:
    enabled: true
    storageClass: longhorn-storageclass
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  
  args:
    - --badger.ephemeral=false
    - --badger.directory-key=/badger/key
    - --badger.directory-value=/badger/data
    - --badger.consistency=false  
    - --badger.maintenance-interval=5m
  
  extraEnv:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"
    - name: BADGER_EPHEMERAL
      value: "false"

agent:
  enabled: false
collector:
  enabled: false
query:
  enabled: false
ingester:
  enabled: false

cassandra:
  enabled: false
elasticsearch:
  enabled: false

service:
  type: ClusterIP
  
serviceMonitor:
  enabled: true
  additionalLabels:
    app.kubernetes.io/part-of: kube-prometheus-stack

