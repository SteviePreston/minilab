resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

persistence:
  enabled: true
  storageClassName: "longhorn-storageclass"
  size: 10Gi

# Security
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472

# Service configuration
service:
  type: LoadBalancer

grafana.ini:
  unified_alerting:
    enabled: true
  alerting:
    enabled: false

# Admin credentials
admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password

# Datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus-production-kube-prometheus.monitoring.svc.cluster.local:9090
      access: proxy
      isDefault: true
      editable: true

    - name: Alertmanager
      type: alertmanager
      url: http://alertmanager-production.monitoring.svc.cluster.local:9093 
      access: proxy
      isDefault: false
      editable: true

# Dashboard providers
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

# Basic dashboards
dashboards:
  default:
    kubernetes-cluster-monitoring:
      gnetId: 7249
      revision: 1
      datasource: Prometheus
    node-exporter:
      gnetId: 1860
      revision: 31
      datasource: Prometheus
    kubernetes-pods:
      gnetId: 6417
      revision: 1
      datasource: Prometheus

