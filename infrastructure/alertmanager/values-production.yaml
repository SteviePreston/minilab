resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Longhorn persistence enabled
persistence:
  enabled: true
  storageClassName: longhorn-storageclass
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# Security
securityContext:
  runAsNonRoot: true
  runAsUser: 65534

podSecurityContext:
  fsGroup: 65534

# Service configuration
service:
  type: ClusterIP

# Simple Discord webhook configuration
config:
  global:
    resolve_timeout: 5m
  
  route:
    receiver: 'discord'
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 1h
  
  receivers:
    - name: 'discord'
      webhook_configs:
        - url: 'https://discord.com/api/webhooks/1412137025699578078/091QFCMixxyPWlgWbvFRLSgZzk5qg5KuGZn3ntjwQCvPgHv2yLnUm8AH0dFa9KUE2v06/slack'
          send_resolved: true
          http_config:
            follow_redirects: true
          title: '@here Alert: {{ .GroupLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            🚨 **{{ .Annotations.summary }}**
            {{ .Annotations.description }}
            Status: {{ .Status }}
            Severity: {{ .Labels.severity }}
            Instance: {{ .Labels.instance }}
            {{ end }}
